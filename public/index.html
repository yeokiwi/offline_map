<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Map Viewer — Singapore</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: Arial, sans-serif; }
    #map { width: 100%; height: 100%; }

    #status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 6px 14px;
      font-family: monospace;
      font-size: 13px;
      z-index: 1000;
    }

    /* --- Routing Panel --- */
    #routing-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      z-index: 1000;
      width: 280px;
      font-size: 13px;
      max-height: calc(100vh - 60px);
      overflow-y: auto;
    }

    #routing-panel .panel-header {
      padding: 10px 12px;
      background: #2196F3;
      color: #fff;
      border-radius: 8px 8px 0 0;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #routing-panel .panel-body { padding: 10px 12px; }

    .mode-toggle {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }

    .mode-toggle button {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 12px;
      border-radius: 4px;
    }

    .mode-toggle button.active {
      background: #2196F3;
      color: #fff;
      border-color: #2196F3;
    }

    .hint { color: #888; font-size: 11px; margin-bottom: 8px; font-style: italic; }

    .waypoint-list { list-style: none; margin: 0 0 10px 0; padding: 0; }

    .waypoint-list li {
      display: flex;
      align-items: center;
      padding: 5px 4px;
      border-bottom: 1px solid #eee;
      gap: 6px;
    }

    .waypoint-list li:last-child { border-bottom: none; }
    .wp-label { font-weight: bold; color: #2196F3; min-width: 18px; }
    .wp-coords { flex: 1; color: #555; font-size: 11px; font-family: monospace; }

    .wp-delete {
      background: none;
      border: none;
      color: #e53935;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px 4px;
    }

    .wp-delete:hover { background: #ffebee; border-radius: 3px; }

    .panel-actions { display: flex; gap: 6px; }

    .panel-actions button {
      flex: 1;
      padding: 7px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .btn-route { background: #4CAF50; color: #fff; }
    .btn-route:hover { background: #43A047; }
    .btn-route:disabled { background: #ccc; cursor: not-allowed; }
    .btn-clear { background: #e53935; color: #fff; }
    .btn-clear:hover { background: #d32f2f; }

    .route-info {
      margin-top: 8px;
      padding: 8px;
      background: #e8f5e9;
      border-radius: 4px;
      font-size: 12px;
    }

    .route-info span { font-weight: bold; }

    .route-error {
      margin-top: 8px;
      padding: 8px;
      background: #ffebee;
      border-radius: 4px;
      font-size: 12px;
      color: #c62828;
    }

    /* --- Chat Panel --- */
    #chat-panel {
      position: fixed;
      top: 10px;
      right: 60px;
      width: 360px;
      max-height: calc(100vh - 60px);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      font-size: 13px;
    }

    #chat-panel.collapsed { display: none; }

    #chat-toggle {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1001;
      background: #7C4DFF;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #chat-toggle:hover { background: #651FFF; }

    .chat-header {
      padding: 10px 12px;
      background: #7C4DFF;
      color: #fff;
      border-radius: 8px 8px 0 0;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .chat-header button {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      padding: 0 4px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      min-height: 200px;
      max-height: 400px;
    }

    .chat-msg {
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .chat-msg.user {
      text-align: right;
    }

    .chat-msg .bubble {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 85%;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .chat-msg.user .bubble {
      background: #E3F2FD;
      color: #1565C0;
    }

    .chat-msg.assistant .bubble {
      background: #F3E5F5;
      color: #4A148C;
    }

    .chat-msg.error .bubble {
      background: #FFEBEE;
      color: #C62828;
    }

    .chat-msg.system .bubble {
      background: #FFF3E0;
      color: #E65100;
      font-size: 11px;
      font-style: italic;
    }

    .chat-input-area {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      border-top: 1px solid #eee;
      flex-shrink: 0;
    }

    .chat-input-area input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }

    .chat-input-area button {
      padding: 8px 14px;
      background: #7C4DFF;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    .chat-input-area button:hover { background: #651FFF; }
    .chat-input-area button:disabled { background: #ccc; cursor: not-allowed; }

    .typing-indicator {
      display: inline-block;
      padding: 8px 12px;
      background: #F3E5F5;
      border-radius: 12px;
      color: #999;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Navigation Panel -->
  <div id="routing-panel">
    <div class="panel-header">
      <span>Navigation</span>
    </div>
    <div class="panel-body">
      <div class="mode-toggle">
        <button id="btn-mode-pan" class="active" onclick="setMode('pan')">Pan</button>
        <button id="btn-mode-waypoint" onclick="setMode('waypoint')">Add Waypoints</button>
      </div>
      <div class="hint" id="mode-hint">Click "Add Waypoints" then click on the map.</div>
      <ul class="waypoint-list" id="waypoint-list"></ul>
      <div class="panel-actions">
        <button class="btn-route" id="btn-route" disabled onclick="computeRoute()">Get Route</button>
        <button class="btn-clear" onclick="clearAll()">Clear All</button>
      </div>
      <div id="route-result"></div>
    </div>
  </div>

  <!-- Chat Toggle Button -->
  <button id="chat-toggle" onclick="toggleChat()" title="AI Route Planner">&#9993;</button>

  <!-- Chat Panel -->
  <div id="chat-panel" class="collapsed">
    <div class="chat-header">
      <span>AI Route Planner</span>
      <button onclick="toggleChat()" title="Close">&times;</button>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="chat-msg system">
        <div class="bubble">Ask me to plan a route! e.g. "Route from Changi Airport to Marina Bay Sands" or "How far is NUS to NTU?"</div>
      </div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Plan a route..." onkeydown="if(event.key==='Enter')sendChat()" />
      <button id="chat-send-btn" onclick="sendChat()">Send</button>
    </div>
  </div>

  <div id="status-bar">Zoom: — | Centre: —</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // --- Map setup ---
    const map = L.map('map', {
      center: [1.3521, 103.8198],
      zoom: 15,
      minZoom: 10,
      maxZoom: 18,
    });

    const streetLayer = L.tileLayer('/tiles/street/{z}/{x}/{y}.png', {
      maxNativeZoom: 15,
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors',
    });

    const satelliteLayer = L.tileLayer('/tiles/satellite/{z}/{x}/{y}.png', {
      maxNativeZoom: 15,
      maxZoom: 18,
      attribution: 'Satellite &copy; Esri',
    });

    streetLayer.addTo(map);

    L.control.layers(
      { 'Street': streetLayer, 'Satellite': satelliteLayer },
      null,
      { position: 'topright' }
    ).addTo(map);

    // --- Status bar ---
    const statusBar = document.getElementById('status-bar');

    function updateStatus() {
      const center = map.getCenter();
      const zoom = map.getZoom();
      statusBar.textContent =
        'Zoom: ' + zoom +
        ' | Centre: ' + center.lat.toFixed(5) + ', ' + center.lng.toFixed(5);
    }

    map.on('moveend', updateStatus);
    map.on('zoomend', updateStatus);
    updateStatus();

    // --- Waypoint & Routing ---
    let mode = 'pan';
    let waypoints = [];
    let routeLine = null;

    const waypointListEl = document.getElementById('waypoint-list');
    const btnRoute = document.getElementById('btn-route');
    const routeResultEl = document.getElementById('route-result');
    const modeHintEl = document.getElementById('mode-hint');

    function setMode(m) {
      mode = m;
      document.getElementById('btn-mode-pan').classList.toggle('active', m === 'pan');
      document.getElementById('btn-mode-waypoint').classList.toggle('active', m === 'waypoint');
      if (m === 'waypoint') {
        modeHintEl.textContent = 'Click on the map to add waypoints.';
        map.getContainer().style.cursor = 'crosshair';
      } else {
        modeHintEl.textContent = 'Click "Add Waypoints" then click on the map.';
        map.getContainer().style.cursor = '';
      }
    }

    function waypointLabel(index) {
      return String.fromCharCode(65 + index);
    }

    function createWaypointIcon(label) {
      return L.divIcon({
        className: '',
        html: '<div style="background:#2196F3;color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.4);">' + label + '</div>',
        iconSize: [26, 26],
        iconAnchor: [13, 13],
      });
    }

    function renderWaypointList() {
      waypointListEl.innerHTML = '';
      waypoints.forEach(function(wp, i) {
        const li = document.createElement('li');
        const label = document.createElement('span');
        label.className = 'wp-label';
        label.textContent = waypointLabel(i);
        const coords = document.createElement('span');
        coords.className = 'wp-coords';
        coords.textContent = wp.latlng.lat.toFixed(5) + ', ' + wp.latlng.lng.toFixed(5);
        const del = document.createElement('button');
        del.className = 'wp-delete';
        del.title = 'Remove waypoint';
        del.innerHTML = '&times;';
        del.onclick = function() { removeWaypoint(i); };
        li.appendChild(label);
        li.appendChild(coords);
        li.appendChild(del);
        waypointListEl.appendChild(li);
      });
      btnRoute.disabled = waypoints.length < 2;
    }

    function addWaypoint(latlng) {
      const index = waypoints.length;
      const marker = L.marker(latlng, {
        icon: createWaypointIcon(waypointLabel(index)),
        draggable: true,
      }).addTo(map);

      const wp = { marker: marker, latlng: latlng };
      waypoints.push(wp);

      marker.on('dragend', function() {
        wp.latlng = marker.getLatLng();
        renderWaypointList();
        clearRoute();
      });

      renderWaypointList();
      clearRoute();
    }

    function removeWaypoint(index) {
      const wp = waypoints[index];
      map.removeLayer(wp.marker);
      waypoints.splice(index, 1);
      waypoints.forEach(function(wp, i) {
        wp.marker.setIcon(createWaypointIcon(waypointLabel(i)));
      });
      renderWaypointList();
      clearRoute();
    }

    function clearRoute() {
      if (routeLine) {
        map.removeLayer(routeLine);
        routeLine = null;
      }
      routeResultEl.innerHTML = '';
    }

    function clearAll() {
      waypoints.forEach(function(wp) { map.removeLayer(wp.marker); });
      waypoints = [];
      clearRoute();
      renderWaypointList();
    }

    map.on('click', function(e) {
      if (mode === 'waypoint') {
        addWaypoint(e.latlng);
      }
    });

    function displayRoute(geometry) {
      if (routeLine) {
        map.removeLayer(routeLine);
      }
      // geometry is [lng, lat] — convert to [lat, lng] for Leaflet
      const latlngs = geometry.map(function(c) { return [c[1], c[0]]; });
      routeLine = L.polyline(latlngs, {
        color: '#1565C0',
        weight: 5,
        opacity: 0.8,
      }).addTo(map);
      map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
    }

    async function computeRoute() {
      if (waypoints.length < 2) return;

      btnRoute.disabled = true;
      btnRoute.textContent = 'Computing...';
      routeResultEl.innerHTML = '';
      clearRoute();

      const coords = waypoints
        .map(function(wp) { return wp.latlng.lng.toFixed(6) + ',' + wp.latlng.lat.toFixed(6); })
        .join(';');

      try {
        const response = await fetch('/api/route?coords=' + encodeURIComponent(coords));
        const data = await response.json();

        if (data.error) {
          routeResultEl.innerHTML = '<div class="route-error">' + data.error + '</div>';
          return;
        }

        if (!data.routes || data.routes.length === 0) {
          routeResultEl.innerHTML = '<div class="route-error">No route found between these points.</div>';
          return;
        }

        const route = data.routes[0];
        displayRoute(route.geometry);

        const distKm = (route.distance / 1000).toFixed(2);
        const durMin = Math.round(route.duration / 60);
        routeResultEl.innerHTML =
          '<div class="route-info">' +
          'Distance: <span>' + distKm + ' km</span><br>' +
          'Duration: <span>~' + durMin + ' min</span>' +
          '</div>';

      } catch (err) {
        routeResultEl.innerHTML = '<div class="route-error">Route request failed: ' + err.message + '</div>';
      } finally {
        btnRoute.disabled = waypoints.length < 2;
        btnRoute.textContent = 'Get Route';
      }
    }

    // --- Chat Interface ---
    const chatPanel = document.getElementById('chat-panel');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const chatSendBtn = document.getElementById('chat-send-btn');

    let chatHistory = []; // conversation messages sent to backend
    let chatOpen = false;

    function toggleChat() {
      chatOpen = !chatOpen;
      chatPanel.classList.toggle('collapsed', !chatOpen);
      if (chatOpen) chatInput.focus();
    }

    function appendChatMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'chat-msg ' + role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      div.appendChild(bubble);
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'chat-msg assistant';
      div.id = 'typing-indicator';
      div.innerHTML = '<div class="typing-indicator">Thinking...</div>';
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    async function sendChat() {
      const text = chatInput.value.trim();
      if (!text) return;

      appendChatMessage('user', text);
      chatInput.value = '';
      chatSendBtn.disabled = true;

      chatHistory.push({ role: 'user', content: text });

      showTyping();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: chatHistory,
          }),
        });

        hideTyping();

        const data = await response.json();

        if (data.error) {
          appendChatMessage('error', data.error);
          chatHistory.pop(); // remove failed user message
          return;
        }

        chatHistory.push({ role: 'assistant', content: data.reply });
        appendChatMessage('assistant', data.reply);

        // If a route geometry was returned, display it on the map
        if (data.route && Array.isArray(data.route) && data.route.length >= 2) {
          displayRoute(data.route);
          appendChatMessage('system', 'Route displayed on the map.');
        }

      } catch (err) {
        hideTyping();
        appendChatMessage('error', 'Request failed: ' + err.message);
        chatHistory.pop();
      } finally {
        chatSendBtn.disabled = false;
        chatInput.focus();
      }
    }
  </script>
</body>
</html>
