<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Map Viewer — Singapore</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    #map { width: 100%; height: 100%; }
    #status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 6px 14px;
      font-family: monospace;
      font-size: 13px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status-bar">Zoom: — | Centre: —</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', {
      center: [1.3521, 103.8198],
      zoom: 15,
      minZoom: 10,
      maxZoom: 18,
    });

    const streetLayer = L.tileLayer('/tiles/street/{z}/{x}/{y}.png', {
      maxNativeZoom: 15,
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors',
    });

    const satelliteLayer = L.tileLayer('/tiles/satellite/{z}/{x}/{y}.png', {
      maxNativeZoom: 15,
      maxZoom: 18,
      attribution: 'Satellite &copy; Esri',
    });

    streetLayer.addTo(map);

    L.control.layers(
      { 'Street': streetLayer, 'Satellite': satelliteLayer },
      null,
      { position: 'topright' }
    ).addTo(map);

    const statusBar = document.getElementById('status-bar');

    function updateStatus() {
      const center = map.getCenter();
      const zoom = map.getZoom();
      statusBar.textContent =
        'Zoom: ' + zoom +
        ' | Centre: ' + center.lat.toFixed(5) + ', ' + center.lng.toFixed(5);
    }

    map.on('moveend', updateStatus);
    map.on('zoomend', updateStatus);
    updateStatus();
  </script>
</body>
</html>
